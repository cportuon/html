<!DOCTYPE   html>
<html>
    <head>
        <title>Práctica Formularios</title>
        <link rel="Stylesheet">
    </head>
    <body>
        <form name="datos" id="datos" action="" method="post">
            <fieldset>
                <legend>Datos Personales</legend>
                <label>Nombre</label>
                <br>
                <input type="text" name="nombre" id="nombre" size="20">
                <br><br>
                <label>Apellido</label>
                <br>
                <input type="text" name="apellido" id="apellido" size="20">
                </fieldset>
                <br>
            <fieldset>
                <legend>Dirección postal</legend>
                <label>Dirección</label>
                <br>
                <input type="text" name="direccion" id="direccion" size="20">
                <br><br>
                <label>Población</label>
                <br>
                <input type="text" name="poblacion" id="poblacion" size="20">
                <br><br>
                <label>Código postal</label>
                <br>
                <input type="text" name="codigopostal" id="codigopostal" size="20">
            </fieldset>
            <br>
            <fieldset>
                <legend>Datos de contacto</legend>
                <label>Email</label>
                <br>
                <input type="text" name="email" id="email" size="20">
                <br><br>
                <label>Teléfono</label>
                <br>
                <input type="text" name="telefono" id="telefono" size="20">
                <br>
            </fieldset>
            <br>
            <input type="submit" value="Enviar Datos">
        </form>
    </body>
</html>
