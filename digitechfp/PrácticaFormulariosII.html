<!doctype html>
<html>
    <head>
        <title>Práctica Formularios</title>
        <link rel="Stylesheet" href="practicaformularios.css">
    </head>
    <body>
        <h1>Bienvenido a la calculadora de medias</h1>
        
        <h2>Introduce tus datos personales</h2>
        <form name="calculadora" id="calculadora" action="" method="post">
            <input type="text" name="nombre" id="name" placeholder="Nombre" size="20">
            <input type="text" name="apellido1" id="apellido1" placeholder="Apellido 1" size="20">
            <input type="text" name="apellido2" id="apellido2" placeholder="Apellido 2" size="20">
            <h2>Introduce tus notas</h2>
            <input type="text" name="nota1" id="nota2" placeholder="Nota 1" size="7">
            <input type="text" name="nota2" id="nota2" placeholder="Nota 2" size="7">
            <input type="text" name="nota3" id="nota3" placeholder="Nota 3" size="7">
            <br>
            <input type="submit" value="Calcular">
        </form>
    </body>
</html>
