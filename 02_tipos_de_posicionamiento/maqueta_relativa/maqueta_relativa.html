<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #container{
            border: 3px solid blue;
            margin: 20px;
            padding: 10px;
            width: 100%;
            height: 100%;
            position: relative;

        }
        #cabecera{
            border: 1px solid orange;
            background-color: blue;
            padding: 10px;
            height: 150px;
        }
        #logo{
            border: 1px solid orange;
            background-color: orange;
            width: 150px;
            height: 120px;
            float: left;    
        }
        #titulo{
            border: 1px solid green;
            background-color: orange;
            width: 500px;
            height: 120px;
            float: left;
            margin-left: 20px;
        }
        #botonera{
            order: 1px solid black;
            background-color: gray;
            margin-top: 10px;   
            padding: 10px;         
            height: 25px;
            position: relative;
        }
        #boton1{
            border: 1px solid yellow;
            background-color: blue;
            width: 200px;
            height: 20px;
            float: left;
        }
        #boton2{
            border: 1px solid yellow;
            background-color: blue;
            width: 200px;
            height: 20px;
            float:left;
            margin-left: 90px;
        }
        #boton3{
            border: 1px solid yellow;
            background-color: blue;
            width: 200px;
            height: 20px;
            float: right;
        }
        #contenido{
            border: 1px solid pink;
            background-color: green;
            margin-top: 10px;
            height:1000px;

        }
    </style>
</head>
<body>
    <div id="container">
        <div id="cabecera">
            <div id="logo"></div>
            <div id="titulo"></div>
        </div>
        <div id="botonera">
            <div id="boton1"></div>
            <div id="boton2"></div>
            <div id="boton3"></div>
        </div>
        <div id="contenido"></div>
    </div>
</body>
</html>
